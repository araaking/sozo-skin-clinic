<!-- SOZO SKIN CLINIC — Hero Section with Integrated Promo Card -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  /* ================= 1. Global & Hero Container ================= */
  .sozo-rewind-hero {
    --sozo-navy: #1A2080;
    --sozo-blue-accent: #2563EB;
    font-family: 'Poppins', sans-serif !important;
    position: relative !important;
    width: 100% !important;
    background: linear-gradient(135deg, #EFF5FF 0%, #FFFFFF 45%, #E6EEFA 100%) !important;
    overflow: hidden !important;
    -webkit-font-smoothing: antialiased !important;
    box-sizing: border-box !important;
  }
  
  .sozo-rewind-hero, 
  .sozo-rewind-hero * {
    box-sizing: border-box !important;
  }

  .sozo-rewind-hero__inner {
    position: relative !important;
    max-width: 1320px !important;
    margin: 0 auto !important;
    display: flex !important;
    align-items: center !important;
    min-height: 520px !important;
    padding: 40px 5% !important;
  }

  .sozo-rewind-hero__blob {
    position: absolute !important;
    top: 50% !important;
    right: 2% !important;
    width: 520px !important;
    height: 520px !important;
    max-width: 90vw !important;
    transform: translateY(-50%) !important;
    background: radial-gradient(circle at 40% 40%, rgba(234, 237, 250, 0.9) 0%, rgba(234, 237, 250, 0) 70%) !important;
    border-radius: 50% !important;
    z-index: 0 !important;
    pointer-events: none !important;
  }

  /* Visual Desktop */
  .sozo-rewind-hero__visual {
    position: absolute !important;
    top: 0 !important;
    right: 0 !important;                         
    width: 58% !important;
    height: 100% !important;
    z-index: 1 !important;
    background-image: url('https://asset.sozoskinclinic.com/wp-content/uploads/2026/08/SKIN-Landing-page-experiment-Peeling-Medical-ed-Main-no-text.webp') !important;
    background-repeat: no-repeat !important;
    background-position: right bottom !important;  
    background-size: cover !important;             
    -webkit-mask-image: linear-gradient(to right, transparent 0%, black 18%), 
                        linear-gradient(to top, transparent 0%, black 8%) !important;
    -webkit-mask-composite: source-in !important;
    mask-image: linear-gradient(to right, transparent 0%, black 18%), 
                linear-gradient(to top, transparent 0%, black 8%) !important;
    mask-composite: intersect !important;
  }

  .sozo-rewind-hero__content {
    position: relative !important;
    z-index: 2 !important;
    width: 55% !important;
    min-width: 280px !important;
    text-align: left !important;
  }

  .sozo-hero-badge {
    display: inline-flex !important;
    align-items: center !important;
    background-color: #D9C7B1 !important;
    color: var(--sozo-navy) !important;
    padding: 7px 18px !important;
    border-radius: 50px !important;
    font-size: 12px !important;
    font-weight: 700 !important;
    letter-spacing: 0.3px !important;
    text-transform: capitalize !important;
    margin-bottom: 22px !important;
    border: 1px solid rgba(26, 32, 128, 0.15) !important;
  }

  /* Title dengan margin bawah yang jelas */
  .sozo-rewind-hero__title {
    font-family: 'Poppins', sans-serif !important;
    color: var(--sozo-navy) !important;   
    font-weight: 800 !important; 
    font-size: clamp(24px, 3.2vw, 38px) !important;
    line-height: 1.35 !important;
    letter-spacing: -0.01em !important;
    margin: 0 0 22px 0 !important;
  }

  .sozo-highlight-underline {
    text-decoration: underline !important;
    text-decoration-color: var(--sozo-blue-accent) !important;
    text-decoration-thickness: 4px !important;
    text-underline-offset: 8px !important;
    text-decoration-skip-ink: none !important;
  }

  /* Description berjarak aman */
  .sozo-rewind-hero__desc {
    color: #4b5563 !important;
    font-size: clamp(14px, 1.1vw, 16px) !important;
    line-height: 1.6 !important;
    font-weight: 500 !important;
    margin: 0 0 24px 0 !important;
  }

  /* ================= 2. Integrated Promo Card ================= */
  .sozo-promo-card-inline {
    margin-top: 0 !important;
    background: #ffffff !important;
    border-radius: 18px !important;
    padding: 10px 16px !important;
    display: flex !important;
    flex-direction: row !important;
    align-items: center !important;
    justify-content: space-between !important;
    gap: 12px !important;
    box-shadow: 0 10px 28px rgba(26, 32, 128, 0.1) !important;
    border: 1px solid rgba(26, 32, 128, 0.08) !important;
    max-width: 500px !important;
    width: 100% !important;
  }

  .sozo-badge-flag {
    flex: 0 0 auto !important;
    background-color: #EBF2FE !important;
    color: #1A2080 !important;
    font-weight: 800 !important;
    font-size: 11px !important;
    line-height: 1.2 !important;
    text-transform: uppercase !important;
    letter-spacing: 0.5px !important;
    padding: 10px 16px !important;
    text-align: center !important;
    border-radius: 10px !important;
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 50%, calc(100% - 8px) 100%, 0 100%) !important;
    padding-right: 20px !important;
  }

  .sozo-text-middle {
    flex: 1 1 auto !important;
    display: flex !important;
    flex-direction: column !important;
    justify-content: center !important;
    align-items: center !important;
    text-align: center !important;
    padding: 0 4px !important;
  }

  .sozo-label-small {
    font-size: 12.5px !important;
    color: #4b5563 !important;
    font-weight: 500 !important;
    margin: 0 !important;
    line-height: 1.2 !important;
    white-space: nowrap !important;
  }

  .sozo-price-large {
    font-size: 24px !important;
    color: #1A2080 !important;
    font-weight: 800 !important;
    letter-spacing: -0.5px !important;
    margin: 2px 0 0 0 !important;
    line-height: 1.1 !important;
  }

  .sozo-action-wrapper {
    flex: 0 0 140px !important;
    width: 140px !important;
    max-width: 140px !important;
  }

  .sozo-action-btn {
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    width: 100% !important;
    height: 44px !important;
    background-color: #1A2080 !important;
    color: #ffffff !important;
    font-weight: 700 !important;
    font-size: 13px !important;
    letter-spacing: 0.5px !important;
    text-transform: uppercase !important;
    text-decoration: none !important;
    border-radius: 12px !important;
    transition: all 0.3s ease !important;
    box-shadow: 0 4px 12px rgba(26, 32, 128, 0.25) !important;
    border: none !important;
  }

  .sozo-action-btn:hover {
    background-color: #2563EB !important;
    transform: translateY(-2px) !important;
    box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35) !important;
  }

  .sozo-rewind-hero__mobile {
    display: none !important;
  }

  /* ================= 3. Mobile Responsiveness ================= */
  @media (max-width: 768px) {
    .sozo-rewind-hero {
      background: none !important;
      min-height: 0 !important;
      height: auto !important;
      padding: 0 !important;
    }

    .sozo-rewind-hero__inner,
    .sozo-rewind-hero__blob,
    .sozo-rewind-hero__visual {
      display: none !important;
    }

    .sozo-rewind-hero__mobile {
      display: block !important;
      width: 100% !important;
      line-height: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    .sozo-rewind-hero__mobile a {
      display: block !important;
      width: 100% !important;
      text-decoration: none !important;
      line-height: 0 !important;
    }

    .sozo-rewind-hero__mobile img {
      width: 100% !important;
      height: auto !important;
      display: block !important;
      object-fit: cover !important;
    }
  }
</style>

<div class="sozo-rewind-hero">
  <div class="sozo-rewind-hero__inner">

    <div class="sozo-rewind-hero__content">

      <p class="sozo-rewind-hero__desc">

      <!-- Promo Card Box -->
      <div class="sozo-promo-card-inline">

        <div class="sozo-badge-flag">

        <!-- Teks Tengah -->
        <div class="sozo-text-middle">

    <!-- Visual Banner Desktop -->
    <div class="sozo-rewind-hero__visual" role="img" aria-label="Peeling Wajah Sozo Skin Clinic"></div>
  </div>

  <!-- Mobile Only Hero Banner -->
  <div class="sozo-rewind-hero__mobile">
    <a href="https://api.whatsapp.com/send?phone=6285175225664&text=Halo%20SOZO,%20saya%20mau%20klaim%20promo%20peeling%20wajah%20199rb%20[sumber:%20SEM-peeling%20treatment]"

      <img src="https://asset.sozoskinclinic.com/wp-content/uploads/2026/08/SKIN-Landing-page-experiment-Peeling-Medical-ed-Main-text.webp" 
           alt="Promo Peeling Wajah Sozo Skin Clinic"

  </div>
</div>
