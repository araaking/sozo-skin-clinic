  }

  .sozo-hero-btn-primary:hover {

    color: var(--sozo-navy) !important;

  .sozo-hero-btn-primary svg {

  /* Default State: Sembunyikan elemen mobile di Desktop */

    }

    .sozo-hero-mobile img {
      width: 100% !important;
      height: auto !important;
      display: block !important;
      object-fit: cover !important;
    }
