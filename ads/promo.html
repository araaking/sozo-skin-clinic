<script>
(function () {
  'use strict';

  if (window.__szsemPromoLoaded) return;
  window.__szsemPromoLoaded = true;

  var MODAL_BASE_ID = 'szsemPromoModal';

  function assignModalIds() {
    var wrappers = document.querySelectorAll('[data-szsem-wrapper]');

    wrappers.forEach(function (wrapper, index) {
      var modal = wrapper.querySelector('[data-szsem-modal]');
      if (!modal) return;

      var modalId = index === 0 ? MODAL_BASE_ID : MODAL_BASE_ID + '-' + (index + 1);
      modal.id = modalId;

      wrapper.querySelectorAll('[data-szsem-src]').forEach(function (card) {
        card.setAttribute('data-szsem-target', modalId);
      });
    });
  }

  function hoistModalsToBody() {
    document.querySelectorAll('[data-szsem-modal]').forEach(function (modal) {
      if (modal.parentNode !== document.body) {
        document.body.appendChild(modal);
      }
    });
  }

  function openPromoModal(modalId, imageSrc) {
    var modal = document.getElementById(modalId);
    if (!modal) return;

    var img = modal.querySelector('img');
    if (img && imageSrc) {
      img.setAttribute('src', imageSrc);
    }

    modal.classList.add('szsem-is-open');
    document.body.style.overflow = 'hidden';
  }

  function closePromoModal(modal) {
    if (!modal || !modal.classList.contains('szsem-is-open')) return;

    modal.classList.remove('szsem-is-open');

    var img = modal.querySelector('img');
    if (img) {
      img.removeAttribute('src');
      img.setAttribute('src', '');
    }

    if (!document.querySelector('.szsem-promo-modal.szsem-is-open')) {
      document.body.style.overflow = '';
    }
  }

  function bindCardClicks() {
    document.addEventListener('click', function (e) {
      var card = e.target.closest('[data-szsem-src]');
      if (!card) return;

      e.preventDefault();
      openPromoModal(card.getAttribute('data-szsem-target'), card.getAttribute('data-szsem-src'));
    });
  }

  function bindModalControls() {
    document.addEventListener('click', function (e) {
      var closeBtn = e.target.closest('[data-szsem-close]');
      if (closeBtn) {
        e.preventDefault();
        e.stopPropagation();
        closePromoModal(closeBtn.closest('[data-szsem-modal]'));
        return;
      }

      var modal = e.target.closest('[data-szsem-modal]');
      if (modal && e.target === modal) {
        closePromoModal(modal);
      }
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' || e.key === 'Esc') {
        document.querySelectorAll('.szsem-promo-modal.szsem-is-open').forEach(closePromoModal);
      }

      if (e.key === 'Enter' || e.key === ' ') {
        var card = e.target.closest('[data-szsem-src]');
        if (card) {
          e.preventDefault();
          openPromoModal(card.getAttribute('data-szsem-target'), card.getAttribute('data-szsem-src'));
        }
      }
    });
  }

  function init() {
    assignModalIds();
    hoistModalsToBody();
    bindCardClicks();
    bindModalControls();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
