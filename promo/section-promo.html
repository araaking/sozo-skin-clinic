<script>
(function() {
  function initSozoPromo() {
    const root = document.getElementById('sozoPromoSection');
    const lightbox = document.getElementById('sozoLightboxModal');
    if (!root || !lightbox) return;

    const track = root.querySelector('.sozo-carousel-track');
    const cards = root.querySelectorAll('.sozo-promo-card');
    const prevBtn = root.querySelector('.sozo-carousel-arrow--prev');
    const nextBtn = root.querySelector('.sozo-carousel-arrow--next');
    const dotsContainer = root.querySelector('#sozoCarouselDots');

    const lightboxClose = document.getElementById('sozoLightboxClose');
    const lightboxImg = document.getElementById('sozoLightboxImg');

    if (!track || !cards.length) return;

    /* 1. Carousel Scroll & Pagination */
    function getCardWidth() {
      const card = cards[0];
      const gap = 20;
      return card.offsetWidth + gap;
    }

    function createDots() {
      dotsContainer.innerHTML = '';
      const maxScroll = track.scrollWidth - track.clientWidth;
      if (maxScroll <= 10) return;

      const visibleCards = Math.round(track.clientWidth / getCardWidth()) || 1;
      const totalSteps = Math.max(2, cards.length - visibleCards + 1);

      for (let i = 0; i < totalSteps; i++) {
        const dot = document.createElement('button');
        dot.className = 'sozo-dot' + (i === 0 ? ' is-active' : '');
        dot.setAttribute('aria-label', 'Lihat slide ' + (i + 1));
        dot.addEventListener('click', function() {
          const target = (maxScroll / (totalSteps - 1)) * i;
          track.scrollTo({ left: target, behavior: 'smooth' });
        });
        dotsContainer.appendChild(dot);
      }
    }

    function updateActiveState() {
      const maxScroll = track.scrollWidth - track.clientWidth;
      const currentScroll = track.scrollLeft;
      const dots = dotsContainer.querySelectorAll('.sozo-dot');

      if (maxScroll > 10 && dots.length > 0) {
        const progress = Math.min(Math.max(currentScroll / maxScroll, 0), 1);
        const activeIdx = Math.round(progress * (dots.length - 1));

        dots.forEach((dot, idx) => {
          dot.classList.toggle('is-active', idx === activeIdx);
        });
      }

      if (prevBtn && nextBtn) {
        prevBtn.classList.toggle('is-disabled', currentScroll <= 5);
        nextBtn.classList.toggle('is-disabled', currentScroll >= maxScroll - 5);
      }
    }

    if (prevBtn) {
      prevBtn.addEventListener('click', function() {
        track.scrollBy({ left: -getCardWidth(), behavior: 'smooth' });
      });
    }

    if (nextBtn) {
      nextBtn.addEventListener('click', function() {
        track.scrollBy({ left: getCardWidth(), behavior: 'smooth' });
      });
    }

    let isScrolling = false;
    track.addEventListener('scroll', function() {
      if (!isScrolling) {
        window.requestAnimationFrame(function() {
          updateActiveState();
          isScrolling = false;
        });
        isScrolling = true;
      }
    });

    window.addEventListener('resize', function() {
      createDots();
      updateActiveState();
    });

    createDots();
    updateActiveState();

    /* 2. Lightbox Murni Gambar */
    function openLightbox(imgUrl, imgAlt) {
      lightboxImg.src = imgUrl;
      lightboxImg.alt = imgAlt || 'Preview Promo SOZO';
      lightbox.classList.add('is-open');
      lightbox.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden'; // Nonaktifkan scroll halaman utama saat popup aktif
    }

    function closeLightbox() {
      lightbox.classList.remove('is-open');
      lightbox.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
      setTimeout(() => {
        lightboxImg.src = '';
      }, 250);
    }

    // Klik gambar kartu untuk membuka Lightbox
    cards.forEach(card => {
      const media = card.querySelector('.sozo-promo-card__media');
      const img = media ? media.querySelector('img') : null;
      if (media && img) {
        media.addEventListener('click', () => openLightbox(img.src, img.alt));
        media.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            openLightbox(img.src, img.alt);
          }
        });
      }
    });

    // Tombol close (X)
    if (lightboxClose) {
      lightboxClose.addEventListener('click', closeLightbox);
    }

    // Klik backdrop/area gelap luar untuk menutup
    lightbox.addEventListener('click', function(e) {
      if (e.target === lightbox || e.target.classList.contains('sozo-lightbox-container')) {
        closeLightbox();
      }
    });

    // Tekan ESC pada keyboard untuk menutup
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && lightbox.classList.contains('is-open')) {
        closeLightbox();
      }
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initSozoPromo);
  } else {
    initSozoPromo();
  }
})();
</script>
