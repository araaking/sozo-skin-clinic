<div class="sozo-locator-wrapper">

  <div class="sozo-locator-header">
    <h2 class="sozo-locator-title">Cabang Klinik Kecantikan Sozo di Bekasi</h2>

<style>
  .sozo-locator-wrapper { max-width: 1200px; margin: 0 auto; padding: 10px 0 80px; }

  /* --- HEADER --- */
  .sozo-locator-header { text-align: center; margin-bottom: 30px; }
  h2.sozo-locator-title, .sozo-locator-title { color: #1A2080 !important; font-size: 32px; line-height: 1.25; font-weight: 800; margin: 0 0 12px; letter-spacing: -0.02em; }
  .sozo-locator-desc { color: #5b5b6b; font-size: 16px; line-height: 1.6; margin: 0 auto; max-width: 560px; }

  /* --- GRID & CARD --- */
  .sozo-map-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; align-content: start; }
  .sozo-map-card { background: #ffffff; border: 1px solid #ececf2; border-radius: 18px; overflow: hidden; box-shadow: 0 1px 3px rgba(16,18,64,0.05); transition: transform .35s ease, box-shadow .35s ease, border-color .35s ease; display: flex; flex-direction: column; }
  .sozo-map-card:hover { transform: translateY(-6px); box-shadow: 0 18px 38px rgba(26,32,128,0.13); border-color: #d9dbf0; }

  /* --- MAP CLICKABLE --- */
  .sozo-map-link { position: relative; display: block; width: 100%; height: 168px; overflow: hidden; text-decoration: none; }
  .sozo-iframe-container { width: 100%; height: 168px; background-color: #e9ecef; }
  .sozo-iframe-container iframe { width: 100%; height: 100%; border: none; display: block; pointer-events: none; }

  .sozo-card-content { padding: 22px 22px 20px; display: flex; flex-direction: column; flex-grow: 1; }
  .sozo-card-content h3 { color: #1A2080 !important; font-size: 18px; line-height: 1.3; margin: 0 0 9px 0; font-weight: 700; letter-spacing: -0.01em; }
  .sozo-address { color: #5b5b6b; font-size: 14px; line-height: 1.55; margin: 0 0 8px 0; flex-grow: 1; }

  /* --- ACTION BUTTONS --- */
  .sozo-action-buttons { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
  .sozo-btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 14px; border-radius: 11px; text-decoration: none; font-size: 14px; font-weight: 600; border: 1.5px solid transparent; transition: all .25s ease; white-space: nowrap; width: 100%; box-sizing: border-box; }
  .sozo-btn svg { width: 17px; height: 17px; fill: currentColor; flex-shrink: 0; }
  .sozo-btn-wa { background-color: #1A2080; color: #ffffff !important; box-shadow: 0 4px 12px rgba(26,32,128,.18); }
  .sozo-btn-wa:hover { background-color: #11164f; transform: translateY(-1px); box-shadow: 0 6px 16px rgba(26,32,128,.28); }

  /* --- MOBILE --- */
  @media (max-width: 768px) {
    .sozo-locator-header { text-align: left; margin-bottom: 22px; }
    .sozo-locator-title { font-size: 24px; }
    .sozo-locator-desc { font-size: 14px; }
    .sozo-map-grid { grid-template-columns: 1fr; gap: 16px; }
    .sozo-card-content { padding: 16px 16px 14px; }
    .sozo-card-content h3 { font-size: 16px; }
    .sozo-address { font-size: 13px; margin-bottom: 8px; }
    .sozo-btn { font-size: 14px; padding: 12px 10px; }
    .sozo-locator-wrapper { padding-bottom: 110px; }
  }
</style>
