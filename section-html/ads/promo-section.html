<style>
  .sz-promo-wrapper {
    --primary-color: #1A2080;
    --primary-hover: #131861;
    --text-dark: #1e293b;
    --text-muted: #475569;
    --card-radius: 20px;
    --font-heading: 'Poppins', 'Inter', system-ui, -apple-system, sans-serif;
    
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
    max-width: 1200px;
    margin: 40px auto;
    padding: 0 20px;
    box-sizing: border-box;
  }

  .sz-promo-wrapper * {
    box-sizing: border-box !important;
  }

  .sz-promo-header {
    display: flex;
    justify-content: space-between;
    align-items: center; 
    margin-bottom: 32px;
    gap: 20px;
  }

  .sz-promo-text {
    flex: 1;
  }

  .sz-promo-title {
    color: var(--primary-color) !important;
    font-family: var(--font-heading) !important;
    font-size: 28px !important;
    font-weight: 700 !important;
    margin: 0 0 8px 0 !important;
    line-height: 1.3 !important;
  }

  .sz-promo-subtitle {
    color: var(--text-muted) !important;
    font-size: 15px !important;
    margin: 0 !important;
    line-height: 1.5 !important;
  }

  .sz-promo-link-desktop {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--primary-color) !important;
    font-size: 15px !important;
    font-weight: 600 !important;
    text-decoration: none !important;
    transition: all 0.3s ease;
    white-space: nowrap;
  }

  .sz-promo-link-desktop:hover {
    color: var(--primary-hover) !important;
    transform: translateX(4px);
  }

  .mobile-only {
    display: none;
  }

  .sz-promo-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 20px;
  }

  .sz-promo-card {
    cursor: pointer;
    border-radius: var(--card-radius);
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    background: #fff;
    position: relative;
    aspect-ratio: 1 / 1;
    outline: none;
  }

  .sz-promo-card:focus-visible {
    outline: 3px solid var(--primary-color);
    outline-offset: 2px;
  }

  .sz-promo-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 12px 24px rgba(26, 32, 128, 0.15);
  }

  .sz-promo-image {
    width: 100%;
    height: 100%;
    position: relative;
  }

  .sz-promo-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.5s ease;
  }

  .sz-promo-card:hover .sz-promo-image img {
    transform: scale(1.05);
  }

  .sz-promo-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(26, 32, 128, 0.6);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .sz-promo-card:hover .sz-promo-overlay,
  .sz-promo-card:focus .sz-promo-overlay {
    opacity: 1;
  }

  .sz-promo-overlay svg {
    margin-bottom: 8px;
  }

  .sz-promo-overlay span {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  .sz-promo-modal {
    display: none;
    position: fixed;
    z-index: 999999;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(5px);
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .sz-promo-modal.show {
    display: flex;
    opacity: 1;
  }

  .sz-modal-content {
    position: relative;
    max-width: 90%;
    max-height: 90vh;
    animation: zoomIn 0.3s ease;
  }

  .sz-modal-content img {
    max-width: 100%;
    max-height: 90vh;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    display: block;
    object-fit: contain;
  }

  .sz-modal-close {
    position: absolute;
    top: -40px;
    right: 0px;
    color: #fff;
    font-size: 35px;
    font-weight: bold;
    cursor: pointer;
    transition: color 0.3s;
    z-index: 100000;
    line-height: 1;
  }

  .sz-modal-close:hover {
    color: #e2e8f0;
  }

  @keyframes zoomIn {
    from { transform: scale(0.95); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  @media (max-width: 1024px) {
    .sz-promo-grid {
      grid-template-columns: repeat(3, 1fr);
    }
  }

  @media (max-width: 768px) {
    .sz-promo-wrapper {
      padding: 0 16px;
      margin: 24px auto;
    }
    
    .sz-promo-header {
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 20px;
    }

    .sz-promo-title {
      font-size: 22px !important;
    }

    .sz-promo-subtitle {
      font-size: 14px !important;
    }

    .sz-promo-link-desktop {
      display: none !important;
    }

    .mobile-only {
      display: block;
    }

    .sz-promo-grid {
      display: flex;
      flex-wrap: nowrap;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding-bottom: 20px; 
      gap: 16px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none; 
    }

    .sz-promo-grid::-webkit-scrollbar {
      display: none; 
    }

    .sz-promo-card {
      flex: 0 0 82%; 
      scroll-snap-align: start;
      border-radius: 16px; 
    }

    .sz-promo-footer {
      margin-top: 10px;
      text-align: center;
    }

    .sz-promo-btn-mobile {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      box-sizing: border-box;
      gap: 8px;
      background-color: var(--primary-color) !important;
      color: #ffffff !important;
      padding: 14px 20px !important;
      border-radius: 30px !important;
      font-size: 15px !important;
      font-weight: 600 !important;
      text-decoration: none !important;
      box-shadow: 0 4px 12px rgba(26, 32, 128, 0.2) !important;
      transition: all 0.3s ease;
    }

    .sz-modal-close {
      top: -35px;
      right: 0px;
      font-size: 30px;
    }
  }
</style>

<script>
  function openPromoModal(imageSrc) {
    const modal = document.getElementById('szPromoModal');
    const modalImg = document.getElementById('szPromoModalImage');
    
    modalImg.src = imageSrc;
    modal.classList.add('show');
    document.body.style.overflow = 'hidden'; 
  }

  function closePromoModal() {
    const modal = document.getElementById('szPromoModal');
    
    modal.classList.remove('show');
    setTimeout(() => {
      if (!modal.classList.contains('show')) {
        document.body.style.overflow = 'auto'; 
        document.getElementById('szPromoModalImage').src = ''; 
      }
    }, 300);
  }

  function handlePromoKey(event, imageSrc) {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      openPromoModal(imageSrc);
    }
  }

  window.addEventListener('click', function(event) {
    const modal = document.getElementById('szPromoModal');
    if (event.target === modal) {
      closePromoModal();
    }
  });
  
  window.addEventListener('keydown', function(event) {
    if (event.key === 'Escape') {
      closePromoModal();
    }
  });
</script>
