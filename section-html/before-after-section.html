<!-- 
  SOZO SKIN CLINIC — Section "Sebelum & Sesudah" (Grid Desktop, Slider Mobile - Font: Poppins)
  Widget: Elementor → Custom HTML (section terpisah dari hero)
-->
<style>
  /* Import font Poppins */
  @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap');

  .sozo-ba-slider {
    --navy: #1A2080;
    --navy-deep: #10154f;
    --navy-tint: #EAEDFA;
    --bg: #FBFBFE;
    position: relative !important;
    width: 100% !important;
    background: var(--bg) !important;
    padding: 72px 5% 64px !important;
    -webkit-font-smoothing: antialiased !important;
  }
  .sozo-ba-slider, .sozo-ba-slider * {
    box-sizing: border-box !important;
  }
  .sozo-ba-slider h2,
  .sozo-ba-slider p {
    margin: 0 !important;
  }

  .sozo-ba-slider__inner {
    max-width: 1200px !important;
    margin: 0 auto !important;
    opacity: 0 !important;
    transform: translateY(24px) !important;
    transition: opacity .7s ease, transform .7s ease !important;
  }
  .sozo-ba-slider__inner.is-visible {
    opacity: 1 !important;
    transform: translateY(0) !important;
  }

  .sozo-ba-slider__head {
    text-align: center !important;
    margin-bottom: 48px !important;
  }
  .sozo-ba-slider__eyebrow {
    display: inline-block !important;
    font-family: 'Poppins', sans-serif !important;
    font-weight: 600 !important;
    font-size: 12.5px !important;
    letter-spacing: 0.14em !important;
    text-transform: uppercase !important;
    color: var(--navy) !important;
    margin-bottom: 10px !important;
  }
  .sozo-ba-slider__title {
    font-family: 'Poppins', sans-serif !important;
    color: var(--navy) !important;
    font-weight: 700 !important; /* Dibuat 700 tebal khas sans-serif modern */
    font-size: clamp(24px, 3.2vw, 36px) !important;
    line-height: 1.25 !important;
  }

  /* Viewport & Track Layout untuk DESKTOP (Grid 3 Komom) */
  .sozo-ba-slider__viewport {
    position: relative !important;
    width: 100% !important;
  }
  .sozo-ba-slider__track {
    display: grid !important;
    grid-template-columns: repeat(3, 1fr) !important;
    gap: 24px !important;
    width: 100% !important;
  }
  .sozo-ba-slider__slide {
    position: relative !important;
    width: 100% !important;
    aspect-ratio: 16 / 10 !important;
    border-radius: 22px !important;
    overflow: hidden !important;
    background: var(--navy-tint) !important;
    box-shadow: 0 10px 30px -10px rgba(26,32,128,.15) !important;
  }
  .sozo-ba-slider__slide img {
    width: 100% !important;
    height: 100% !important;
    object-fit: cover !important;
    display: block !important;
  }

  /* Sembunyikan navigasi tombol & dots di Desktop */
  .sozo-ba-slider__nav,
  .sozo-ba-slider__dots {
    display: none !important;
  }

  /* RESPONSIVE: MOBILE & TABLET KECIL */
  @media (max-width: 991px) {
    .sozo-ba-slider { 
      padding: 52px 6% 48px !important; 
    }
    .sozo-ba-slider__head { 
      margin-bottom: 32px !important; 
    }
    .sozo-ba-slider__track {
      display: flex !important;
      overflow-x: auto !important;
      scroll-snap-type: x mandatory !important;
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
      gap: 0 !important;
    }
    .sozo-ba-slider__track::-webkit-scrollbar {
      display: none !important;
    }
    .sozo-ba-slider__slide {
      flex: 0 0 100% !important;
      scroll-snap-align: center !important;
      border-radius: 16px !important;
    }
    .sozo-ba-slider__dots {
      display: flex !important;
      justify-content: center !important;
      gap: 8px !important;
      margin-top: 24px !important;
    }
    .sozo-ba-slider__dot {
      width: 8px !important;
      height: 8px !important;
      border-radius: 50% !important;
      border: none !important;
      background: var(--navy-tint) !important;
      cursor: pointer !important;
      padding: 0 !important;
      transition: background .2s ease, width .2s ease, border-radius .2s ease !important;
    }
    .sozo-ba-slider__dot.is-active {
      background: var(--navy) !important;
      width: 22px !important;
      border-radius: 5px !important;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .sozo-ba-slider__inner {
      transition: none !important;
      opacity: 1 !important;
      transform: none !important;
    }
  }
</style>

<section class="sozo-ba-slider">
  <div class="sozo-ba-slider__inner" id="sozoBaInner">

    <div class="sozo-ba-slider__head">
      <span class="sozo-ba-slider__eyebrow">Hasil Pasien</span>
      <h2 class="sozo-ba-slider__title">HASIL NATURAL OLEH DOKTER PROFESIONAL</h2>
    </div>

    <div class="sozo-ba-slider__viewport">
      <div class="sozo-ba-slider__track" id="sozoBaTrack">
        
        <!-- Slide 1: Nose Job -->
        <div class="sozo-ba-slider__slide">
          <img src="https://asset.sozoskinclinic.com/wp-content/uploads/2026/07/LP-Mockup-Peeling-LP-Before-After-Peeling-Face-V2.webp" alt="Hasil sebelum dan sesudah perawatan Nose Job" loading="lazy">
        </div>
        
        <!-- Slide 2: Thread Lift 1 -->
        <div class="sozo-ba-slider__slide">
          <img src="https://asset.sozoskinclinic.com/wp-content/uploads/2026/07/LP-Mockup-Peeling-LP-Before-After-Peeling-Face-V3.webp" alt="Hasil sebelum dan sesudah perawatan Thread Lift pasien 1" loading="lazy">
        </div>
        
        <!-- Slide 3: Thread Lift 2 -->
        <div class="sozo-ba-slider__slide">
          <img src="https://asset.sozoskinclinic.com/wp-content/uploads/2026/07/LP-Mockup-Peeling-LP-Before-After-Peeling-Face-V1.webp" alt="Hasil sebelum dan sesudah perawatan Thread Lift pasien 2" loading="lazy">
        </div>

      </div>
    </div>

    <!-- Container Dots (Otomatis muncul di mobile) -->
    <div class="sozo-ba-slider__dots" id="sozoBaDots"></div>
  </div>
</section>

<script>
(function () {
  var wrap = document.getElementById('sozoBaInner');
  var track = document.getElementById('sozoBaTrack');
  var dotsWrap = document.getElementById('sozoBaDots');
  var slides = track.querySelectorAll('.sozo-ba-slider__slide');

  // Generate dots secara dinamis untuk versi mobile/tablet
  slides.forEach(function (_, i) {
    var dot = document.createElement('button');
    dot.type = 'button';
    dot.className = 'sozo-ba-slider__dot';
    dot.setAttribute('aria-label', 'Ke slide ' + (i + 1));
    dot.addEventListener('click', function () {
      slides[i].scrollIntoView({ behavior: 'smooth', inline: 'start', block: 'nearest' });
    });
    dotsWrap.appendChild(dot);
  });
  
  var dots = dotsWrap.querySelectorAll('.sozo-ba-slider__dot');

  function setActive(i) {
    dots.forEach(function (d, idx) {
      d.classList.toggle('is-active', idx === i);
    });
  }

  // Deteksi scroll slide untuk mengaktifkan dot yang sesuai di mobile
  var ticking = false;
  track.addEventListener('scroll', function () {
    if (window.getComputedStyle(dotsWrap).display === 'none') return;

    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function () {
      var idx = Math.round(track.scrollLeft / track.clientWidth);
      setActive(idx);
      ticking = false;
    });
  });

  setActive(0);

  // Efek Fade-In saat section muncul di layar
  if ('IntersectionObserver' in window) {
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          wrap.classList.add('is-visible');
          observer.disconnect();
        }
      });
    }, { threshold: 0.1 });
    observer.observe(wrap);
  } else {
    wrap.classList.add('is-visible');
  }
})();
</script>
