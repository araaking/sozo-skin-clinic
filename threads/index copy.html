<style>
  /* ================= 1. Global & Hero Container ================= */
  .sozo-threads-hero {
    --sozo-navy: #1A2080;
    --sozo-navy-hover: #131761;
    --sozo-blue-accent: #2563EB;
    --sozo-badge-gold: #D9C7B1;
    --sozo-text-dark: #1E293B;
    --sozo-text-body: #475569;
    --sozo-bg-cream: #FAF8F5;
    
    font-family: 'Inter', system-ui, -apple-system, sans-serif !important;
    position: relative !important;
    width: 100% !important;
    background-color: var(--sozo-bg-cream) !important;
    background-image: url('https://asset.sozoskinclinic.com/wp-content/uploads/2026/09/threads-hero-lp-2.webp') !important;
    background-repeat: no-repeat !important;
    background-position: right center !important;
    background-size: cover !important;
    overflow: hidden !important;
    -webkit-font-smoothing: antialiased !important;
    box-sizing: border-box !important;
  }
  
  .sozo-threads-hero, 
  .sozo-threads-hero * {
    box-sizing: border-box !important;
  }

  /* Gradasi Dinonaktifkan */
  .sozo-threads-hero::before {
    content: '' !important;
    position: absolute !important;
    top: 0; left: 0; right: 0; bottom: 0;
    display: none !important;
    background: none !important;
    z-index: 1 !important;
  }

  .sozo-threads-hero__inner {
    position: relative !important;
    max-width: 1320px !important;
    margin: 0 auto !important;
    display: flex !important;
    align-items: center !important;
    min-height: 560px !important;
    padding: 56px 5% !important;
    z-index: 2 !important;
  }

  .sozo-threads-hero__content {
    position: relative !important;
    z-index: 2 !important;
    width: 58% !important;
    min-width: 320px !important;
    max-width: 660px !important;
    text-align: left !important;
  }

  /* Title */
  .sozo-threads-hero__title {
    font-family: 'Poppins', sans-serif !important;
    color: var(--sozo-navy) !important;   
    font-weight: 800 !important; 
    font-size: clamp(26px, 3.2vw, 40px) !important;
    line-height: 1.25 !important;
    letter-spacing: -0.01em !important;
    margin: 0 0 16px 0 !important;
  }

  /* Highlight aksen warna emas/nude khas SOZO */
  .sozo-highlight-gold {
    color: #D9C7B1 !important;
    display: inline-block !important;
  }

  /* Description */
  .sozo-threads-hero__desc {
    color: var(--sozo-navy) !important;
    font-size: clamp(14px, 1.05vw, 15.5px) !important;
    line-height: 1.6 !important;
    font-weight: 500 !important;
    margin: 0 0 20px 0 !important;
    max-width: 580px !important;
  }

  /* ================= 2. Price Badge & Notes ================= */
  .sozo-price-wrapper {
    display: flex !important;
    flex-direction: column !important;
    align-items: flex-start !important;
    gap: 6px !important;
    margin-bottom: 24px !important;
  }

  .sozo-price-badge {
    display: inline-flex !important;
    align-items: baseline !important;
    gap: 8px !important;
    background: #ffffff !important;
    border: 1.5px solid rgba(26, 32, 128, 0.16) !important;
    padding: 8px 18px !important;
    border-radius: 12px !important;
    box-shadow: 0 4px 14px rgba(26, 32, 128, 0.08) !important;
  }

  .sozo-price-label {
    font-size: 13.5px !important;
    font-weight: 600 !important;
    color: var(--sozo-navy) !important;
    letter-spacing: 0.1px !important;
  }

  .sozo-price-amount {
    font-family: 'Poppins', sans-serif !important;
    font-size: 20px !important;
    font-weight: 800 !important;
    color: var(--sozo-navy) !important;
    letter-spacing: -0.02em !important;
    line-height: 1 !important;
  }

  .sozo-price-note {
    font-size: 12px !important;
    color: var(--sozo-navy) !important;
    font-style: italic !important;
    display: inline-flex !important;
    align-items: center !important;
    gap: 4px !important;
    padding-left: 2px !important;
    opacity: 0.85 !important;
  }

  /* ================= 3. Checklist Features ================= */
  .sozo-checklist-group {
    display: flex !important;
    align-items: center !important;
    gap: 12px !important;
    flex-wrap: wrap !important;
    margin-bottom: 28px !important;
  }

  .sozo-checklist-item {
    display: inline-flex !important;
    align-items: center !important;
    gap: 8px !important;
    background: rgba(255, 255, 255, 0.9) !important;
    border: 1px solid rgba(26, 32, 128, 0.12) !important;
    padding: 7px 14px !important;
    border-radius: 50px !important;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04) !important;
  }

  .sozo-check-icon {
    width: 18px !important;
    height: 18px !important;
    border-radius: 50% !important;
    background-color: var(--sozo-navy) !important;
    color: #ffffff !important;
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    flex-shrink: 0 !important;
  }

  .sozo-check-icon svg {
    width: 11px !important;
    height: 11px !important;
    stroke: #ffffff !important;
    stroke-width: 2.8 !important;
    fill: none !important;
  }

  .sozo-checklist-text {
    font-size: 13px !important;
    font-weight: 600 !important;
    color: var(--sozo-navy) !important;
    white-space: nowrap !important;
  }

  /* ================= 4. CTA Button ================= */
  .sozo-button-group {
    display: flex !important;
    align-items: center !important;
    gap: 14px !important;
    flex-wrap: wrap !important;
  }

  .sozo-btn-primary {
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    gap: 10px !important;
    height: 48px !important;
    padding: 0 32px !important;
    background-color: var(--sozo-navy) !important;
    color: #ffffff !important;
    font-family: 'Inter', system-ui, -apple-system, sans-serif !important;
    font-weight: 700 !important;
    font-size: 14px !important;
    letter-spacing: 0.5px !important;
    text-transform: uppercase !important;
    text-decoration: none !important;
    border-radius: 50px !important;
    border: 2px solid var(--sozo-navy) !important;
    transition: all 0.25s ease !important;
    box-shadow: 0 6px 18px rgba(26, 32, 128, 0.25) !important;
  }

  .sozo-btn-primary svg {
    width: 18px !important;
    height: 18px !important;
    fill: #ffffff !important;
    transition: fill 0.25s ease !important;
  }

  .sozo-btn-primary:hover {
    background-color: #ffffff !important;
    color: var(--sozo-navy) !important;
    border-color: var(--sozo-navy) !important;
    transform: translateY(-2px) !important;
    box-shadow: 0 8px 24px rgba(26, 32, 128, 0.32) !important;
  }

  .sozo-btn-primary:hover svg {
    fill: var(--sozo-navy) !important;
  }

  /* ================= 5. Responsiveness (Mobile) ================= */
  @media (max-width: 820px) {
    .sozo-threads-hero {
      background-position: 75% center !important;
    }

    .sozo-threads-hero__inner {
      min-height: auto !important;
      padding: 40px 20px 48px !important;
    }

    .sozo-threads-hero__content {
      width: 100% !important;
      max-width: 100% !important;
    }

    .sozo-threads-hero__title {
      font-size: clamp(24px, 6.5vw, 32px) !important;
      line-height: 1.28 !important;
    }

    .sozo-price-badge {
      padding: 7px 14px !important;
    }

    .sozo-price-amount {
      font-size: 18px !important;
    }

    .sozo-checklist-group {
      gap: 8px !important;
      margin-bottom: 24px !important;
    }

    .sozo-checklist-item {
      padding: 6px 12px !important;
      font-size: 12.5px !important;
    }

    .sozo-btn-primary {
      width: 100% !important;
      height: 50px !important;
      font-size: 14px !important;
    }
  }
</style>
