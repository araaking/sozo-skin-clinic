    const totalPages = Math.ceil(filteredTreatments.length / itemsPerPage);

      infoEl.innerHTML = filteredTreatments.length > 0 ? `Menampilkan ${filteredTreatments.length} layanan` : '';

    }
    let html = `<button class="sz-page-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="szChangePage(${currentPage - 1})">${iconChevronLeft}</button>`;
    for (let i = 1; i <= totalPages; i++) {

    }
    html += `<button class="sz-page-btn" ${currentPage === totalPages ? 'disabled' : ''} onclick="szChangePage(${currentPage + 1})">${iconChevronRight}</button>`;

    renderNewTreatment();
    renderHorizontalCategories();
    renderChips();
    renderGrid();

    if (searchInput) {

    }
    return true;
  }

      setTimeout(runLoop, 200);
    }
  }

  else { document.addEventListener('DOMContentLoaded', runLoop); }
